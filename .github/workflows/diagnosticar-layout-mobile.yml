name: Diagnosticar textos sobrepostos em celular
on:
  push:
    branches: [fix/layout-textos-mobile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Localizar Google Chrome
        run: |
          which google-chrome
          google-chrome --version
      - run: npm run export:web
      - name: Medir com navegador real
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 -d dist >/tmp/servidor.log 2>&1 &
          sleep 2
          CHROME_BIN="$(command -v google-chrome)" node scripts/diagnosticar-layout-mobile.cjs
