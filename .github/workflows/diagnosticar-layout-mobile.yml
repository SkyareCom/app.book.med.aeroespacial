name: Diagnosticar textos sobrepostos em celular
on:
  push:
    branches: [fix/layout-textos-mobile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Conferir integridade do app
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          node scripts/check-m1v1-frozen.cjs
          node scripts/traduzir.cjs | tee /tmp/idiomas.txt
          grep -q 'en-US: 0 texto(s) sem tradução' /tmp/idiomas.txt
          grep -q 'es-ES: 0 texto(s) sem tradução' /tmp/idiomas.txt
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Localizar Google Chrome
        run: |
          which google-chrome
          google-chrome --version
      - run: npm run export:web
      - name: Medir com navegador real
        run: |
          mkdir -p /tmp/site/app.book.med.aeroespacial
          cp -a dist/. /tmp/site/app.book.med.aeroespacial/
          python3 -m http.server 4173 --bind 127.0.0.1 -d /tmp/site >/tmp/servidor.log 2>&1 &
          sleep 2
          CHROME_BIN="$(command -v google-chrome)" node scripts/diagnosticar-layout-mobile.cjs
