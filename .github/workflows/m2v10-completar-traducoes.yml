name: Completar dicionários M2V10 via modelos locais
on:
  push:
    branches: [m2v10-digestivo]
    paths:
      - '.github/workflows/m2v10-completar-traducoes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  completar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2v10-digestivo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar TypeScript e tradutor de código aberto
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'argostranslate==1.10.0'
      - name: Validar sintaxe do tradutor
        run: python -m py_compile scripts/m2v10-traducao-local.py
      - name: Preencher traduções ausentes sem alterar chaves anteriores
        run: python -u scripts/m2v10-traducao-local.py
      - name: Exigir zero traduções faltantes
        run: |
          set -euo pipefail
          node scripts/traduzir.cjs | tee /tmp/m2v10-traduzidos.txt
          grep -q 'en-US: 0 texto(s) sem tradução' /tmp/m2v10-traduzidos.txt
          grep -q 'es-ES: 0 texto(s) sem tradução' /tmp/m2v10-traduzidos.txt
      - name: TypeScript e congelamento
        run: |
          npx tsc --noEmit
          node scripts/check-m1v1-frozen.cjs
      - name: Regenerar fichas de idiomas
        run: npm run -s loja:ficha
      - name: Registrar dicionários preliminares apenas no ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/en-US.json src/i18n/es-ES.json docs/loja/ficha-*.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(m2v10): completar dicionários PT EN ES por tradução local" -m "Co-authored-by: ChatGPT <noreply@openai.com>"
            git push origin HEAD:m2v10-digestivo
          fi
