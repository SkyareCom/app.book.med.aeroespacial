name: M2V10 teste de tradução local
on:
  push:
    branches: [m2v10-digestivo]
    paths: [.github/workflows/m2v10-teste-traducao.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Argos Translate open-source
        run: python -m pip install --disable-pip-version-check 'argostranslate==1.10.0'
      - name: Conferir modelos PT EN ES e traduzir frases de teste
        run: |
          python - <<'PY'
          import argostranslate.package
          import argostranslate.translate
          argostranslate.package.update_package_index()
          models = argostranslate.package.get_available_packages()
          pairs = [m for m in models if (m.from_code, m.to_code) in [('pt','en'), ('pb','en'), ('pt','es'), ('en','es'),('pb','es')]]
          print('Modelos:', [(p.from_code,p.to_code,str(p.package_version)) for p in pairs])
          for src,dst in [('pt','en'),('pt','es'),('en','es')]:
            model=next((p for p in pairs if p.from_code==src and p.to_code==dst), None)
            if model:
              model_path=model.download()
              argostranslate.package.install_from_path(model_path)
              print('Instalado',src,dst)
          for lang in ['en','es']:
            for s in ["A **diarreia** elimina água e sais pelas fezes.", "A pressão cai durante a subida. Gás preso no intestino aumenta de volume."]:
              try:
                print(lang,repr(argostranslate.translate.translate(s,'pt',lang)))
              except Exception as e:
                print(lang,'ERRO',str(e))
                raise
          PY
