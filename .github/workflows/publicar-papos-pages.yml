# Compile and publish the actual Expo web bundle, not the TypeScript source.
# GitHub Pages must use the gh-pages branch at / (root).
name: Publicar PAPOS DE ALTITUDE no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papos-de-altitude-gh-pages
  cancel-in-progress: false

jobs:
  web:
    name: Validar, compilar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verificar congelamento editorial de M1V1 I-IV
        run: node scripts/check-m1v1-frozen.cjs

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar HTML de produção
        run: npm run export:web

      - name: Conferir conteúdo e navegação exportados
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/_expo
          test -s dist/capitulo/conceitos/1.html
          # A entrada deve ser a Home, nunca uma tela de capítulo inválido.
          grep -q 'Sua evolução' dist/index.html
          if grep -q 'Voo não encontrado' dist/index.html; then
            echo 'ERRO: a entrada do app está renderizando uma tela de erro.'
            exit 1
          fi
          # O M1V1 precisa abrir com todos os tópicos, inclusive o IV congelado.
          if ! grep -q 'M1V1 - IV: Temperatura e umidade' dist/capitulo/conceitos/1.html; then
            echo 'ERRO: o quarto tópico não está presente no HTML do M1V1.'
            exit 1
          fi
          if grep -q 'Voo não encontrado' dist/capitulo/conceitos/1.html; then
            echo 'ERRO: a rota do M1V1 está renderizando um voo inexistente.'
            exit 1
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publicar arquivos reais na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          enable_jekyll: false
          keep_files: false
          commit_message: 'Publicar HTML: ${{ github.sha }}'
