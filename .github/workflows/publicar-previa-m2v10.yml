# Prévia isolada do M2V10 — não altera a main e não substitui o PWA de produção.
name: Publicar prévia HTML do M2V10

on:
  push:
    branches: [m2v10-digestivo]
    paths:
      - '.github/workflows/publicar-previa-m2v10.yml'
      - 'src/data/**'
      - 'src/i18n/**'
      - 'src/components/**'
      - 'assets/images/topicos/m2v10-*'
      - 'assets/videos/m2v10-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papos-m2v10-preview
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter ramo M2V10
        uses: actions/checkout@v4
        with:
          ref: m2v10-digestivo
          path: source
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Isolar URL, manifesto e service worker da prévia
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          app = Path('source/app.json')
          data = json.loads(app.read_text())
          assert data['expo']['experiments']['baseUrl'] == '/app.book.med.aeroespacial'
          data['expo']['experiments']['baseUrl'] = '/app.book.med.aeroespacial/m2v10'
          app.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          html = Path('source/src/app/+html.tsx')
          text = html.read_text()
          old = "const BASE = '/app.book.med.aeroespacial';"
          assert text.count(old) == 1
          html.write_text(text.replace(old, "const BASE = '/app.book.med.aeroespacial/m2v10';"))
          manifest = Path('source/public/manifest.webmanifest')
          m = manifest.read_text()
          assert '/app.book.med.aeroespacial/' in m
          manifest.write_text(m.replace('/app.book.med.aeroespacial/', '/app.book.med.aeroespacial/m2v10/'))
          sw = Path('source/public/sw.js')
          s = sw.read_text()
          assert "const VERSAO = 'papos-v1';" in s
          sw.write_text(s.replace("const VERSAO = 'papos-v1';", "const VERSAO = 'papos-m2v10-previa-v1';"))
          PY
      - name: Instalar dependências
        working-directory: source
        run: npm ci
      - name: TypeScript
        working-directory: source
        run: npx tsc --noEmit
      - name: Verificar congelamento M1V1
        working-directory: source
        run: node scripts/check-m1v1-frozen.cjs
      - name: Auditar mídias
        working-directory: source
        run: |
          set -o pipefail
          npm run -s auditar:midias | tee /tmp/m2v10-previa-midias.txt
          grep -q '0 pendência(s) de mídia' /tmp/m2v10-previa-midias.txt
      - name: Gerar HTML da prévia
        working-directory: source
        run: npm run export:web
      - name: Conferir M2V10 renderizado
        run: |
          test -s source/dist/index.html
          test -s source/dist/capitulo/sistemas/10.html
          test -d source/dist/_expo
          ! grep -q 'Voo não encontrado' source/dist/capitulo/sistemas/10.html
          touch source/dist/.nojekyll
      - name: Obter site publicado sem tocar no conteúdo de produção
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Atualizar somente a pasta de prévia
        run: |
          set -euo pipefail
          test -d published/.git
          rm -rf published/m2v10
          mkdir -p published/m2v10
          cp -a source/dist/. published/m2v10/
          cp published/m2v10/index.html published/m2v10/404.html
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -- m2v10
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m 'preview(m2v10): atualizar HTML isolado sem alterar produção'
            git -C published push origin HEAD:gh-pages
          fi
