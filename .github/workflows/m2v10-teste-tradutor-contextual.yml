name: Testar qualidade de tradutor contextual M2V10
on:
  push:
    branches: [m2v10-digestivo]
    paths: [.github/workflows/m2v10-teste-tradutor-contextual.yml]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  traducao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Testar endpoints públicos somente com texto editorial
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          samples=[
            "A diarreia elimina água e sais pelas fezes; pode ser causada por infecção, medicamento ou inflamação.",
            "A úlcera péptica é uma ferida que pode sangrar ou perfurar.",
            "A cirrose pode provocar ascite, varizes esofágicas e encefalopatia hepática.",
            "A vesícula biliar guarda a bile produzida pelo fígado.",
          ]
          for endpoint in ['https://translate.googleapis.com/translate_a/t?client=dict-chrome-ex','https://translate.googleapis.com/translate_a/single?client=gtx&dt=t']:
            for lang in ['en','es']:
              params=[('sl','pt'),('tl',lang)]+[('q',s) for s in samples]
              url=endpoint+'&'+urllib.parse.urlencode(params)
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=12) as r:
                  payload=r.read(15000)
                print('ENDPOINT',endpoint.split('/translate_a/')[-1].split('?')[0],'LANG',lang,'STATUS',len(payload),'DATA',payload.decode('utf8')[:1500])
              except Exception as e: print('ERROR',str(e)[:250])
          PY
